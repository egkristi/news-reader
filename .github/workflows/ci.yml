name: CI/CD Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4

    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: '1.23'
        cache: true
        
    - name: Install dependencies
      run: go mod download

    - name: Run tests with coverage
      run: |
        go test -v -race -coverprofile=coverage.txt -covermode=atomic ./...
        go tool cover -func=coverage.txt

  build:
    name: Build
    needs: [test]
    runs-on: ubuntu-latest
    if: github.event_name == 'push'
    
    steps:
    - uses: actions/checkout@v4

    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: '1.23'
        cache: true

    - name: Build binary
      run: |
        CGO_ENABLED=0 go build \
          -ldflags "-w -s \
            -X github.com/news-reader/internal/version.Version=0.1.0 \
            -X github.com/news-reader/internal/version.BuildTime=$(date -u +%Y-%m-%dT%H:%M:%SZ) \
            -X github.com/news-reader/internal/version.GitCommit=$(git rev-parse --short HEAD)" \
          -o news-reader ./cmd/server
